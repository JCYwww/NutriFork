<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <title>低碳生酮餐</title>
  <link rel="stylesheet" href="./低碳生酮餐.css">
  <script src="./低碳生酮餐.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Noto+Serif+JP:wght@200..900&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Rampart+One&family=Stick&display=swap"
    rel="stylesheet">
</head>

<body>

  <div class="logo">
    <a href="../../菜單/菜單.html">
      <img src="./logo3.png" alt="">
    </a>
  </div>

  <img src="./火箭.png" alt="火箭" class="rocket" />


  <div class="main-container">

    <div class="meal-info">
      <h2 class="name">低碳生酮餐</h2>
      <p>• 控糖低碳</p>
      <p>• 好油脂提供長效能量</p>
      <p>• 飽足抗疲勞</p>
      <p class="price">$150</p>
    </div>

    <div class="plate-container">
      <img src="./盤子.png" alt="盤子背景" class="plate">

      <div class="food steak">
        <div class="food-img">
          <img src="./牛排.png" alt="牛排">
          <div class="info">高蛋白＋好脂，飽足抗疲勞</div>
        </div>
      </div>

      <div class="food avocado">
        <div class="food-img">
          <img src="./酪梨.png" alt="酪梨">
          <div class="info">含好油脂，有助心血管健康</div>
        </div>
      </div>

      <div class="food cauliflower">
        <div class="food-img">
          <img src="./花椰菜.png" alt="花椰菜">
          <div class="info">高纖低碳，幫助腸道健康</div>
        </div>
      </div>

      <div class="food blueberry">
        <div class="food-img">
          <img src="./藍莓.png" alt="藍莓">
          <div class="info">低糖抗氧化，營養濃縮果實</div>
        </div>
      </div>
    </div>


  </div>

</body>

</html>
