<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <title>高蛋白餐</title>
  <link rel="stylesheet" href="./高蛋白健身餐.css">
  <script src="./高蛋白健身餐.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Noto+Serif+JP:wght@200..900&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Rampart+One&family=Stick&display=swap"
    rel="stylesheet">
</head>

<body>

  <div class="logo">
    <a href="../../菜單/菜單.html">
      <img src="./logo3.png" alt="">
    </a>
  </div>

  <img src="./火箭.png" alt="火箭" class="rocket" />

  <div class="main-container">
    <div class="meal-info">
      <h2 class="name">高蛋白健身餐</h2>
      <p>• 高蛋白質</p>
      <p>• 飽足感強</p>
      <p>• 促進肌肉修復</p>
      <p class="price">$150</p>
    </div>

    <div class="plate-container">
      <img src="./盤子.png" alt="盤子背景" class="plate">

      <div class="food chicken">
        <div class="food-img">
          <img src="./雞胸肉蛋.png" alt="雞胸＋蛋">
          <div class="info">雙重高蛋白，促進肌肉修復</div>
        </div>
      </div>

      <div class="food broccoli">
        <div class="food-img">
          <img src="./花椰菜.png" alt="青花菜">
          <div class="info">富含抗氧化物，幫助排毒</div>
        </div>
      </div>

      <div class="food rice">
        <div class="food-img">
          <img src="./糙米飯.png" alt="糙米飯">
          <div class="info">低GI，穩定能量來源</div>
        </div>
      </div>

      <div class="food banana">
        <div class="food-img">
          <img src="./香蕉.png" alt="香蕉">
          <div class="info">富含鉀，有助肌肉放鬆</div>
        </div>
      </div>
    </div>



  </div>

</body>

</html>
