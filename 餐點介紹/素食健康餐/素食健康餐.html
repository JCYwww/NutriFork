<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <title>素食健康餐</title>
  <link rel="stylesheet" href="./素食健康餐.css">
  <script src="./素食健康餐.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Noto+Serif+JP:wght@200..900&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Rampart+One&family=Stick&display=swap"
    rel="stylesheet">
</head>

<body>

  <div class="logo">
    <a href="../../菜單/菜單.html">
      <img src="./logo3.png" alt="">
    </a>
  </div>

  <img src="./火箭.png" alt="火箭" class="rocket" />

  <div class="main-container">
    <div class="meal-info">
      <h2 class="name">素食健康餐</h2>
      <p>• 完整植物營養</p>
      <p>• 環保健康選擇</p>
      <p>• 減少動物性攝取</p>
      <p class="price">$120</p>
    </div>

    <div class="plate-container">
      <img src="./盤子.png" alt="盤子背景" class="plate">

      <div class="food tofu">
        <div class="food-img">
          <img src="./滷豆腐.png" alt="豆腐">
          <div class="info">植物性蛋白，低脂營養又飽足</div>
        </div>
      </div>

      <div class="food mixveggies">
        <div class="food-img">
          <img src="./烤南瓜＋甜椒.png" alt="南瓜與甜椒">
          <div class="info">富含維生素A+C，抗老又護眼</div>
        </div>
      </div>

      <div class="food grainrice">
        <div class="food-img">
          <img src="./糙米飯.png" alt="雜糧飯">
          <div class="info">高纖雜糧，促進腸道蠕動</div>
        </div>
      </div>

      <div class="food grape">
        <div class="food-img">
          <img src="./葡萄.png" alt="葡萄">
          <div class="info">補水抗氧化的小粒能量</div>
        </div>
      </div>
    </div>



  </div>

</body>

</html>
