<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <title>每日超值餐</title>
  <link rel="stylesheet" href="./每日超值餐.css">
  <script src="./每日超值餐.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Noto+Serif+JP:wght@200..900&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Rampart+One&family=Stick&display=swap"
    rel="stylesheet">
</head>

<body>

  <div class="logo">
    <a href="../../菜單/菜單.html">
      <img src="./logo3.png" alt="">
    </a>
  </div>

  <img src="./火箭.png" alt="火箭" class="rocket" />


  <div class="main-container">

    <div class="meal-info">
      <h2 class="name">每日超值餐</h2>
      <p>• 輕盈均衡</p>
      <p>• CP值超高</p>
      <p>• 每天都吃也不膩</p>
      <p class="price">$100</p>
    </div>

    <div class="plate-container">
      <img src="./盤子.png" alt="盤子背景" class="plate">

      <div class="food fish">
        <div class="food-img">
          <img src="./烤鯖魚.png" alt="魚">
          <div class="info">富含 Omega-3 脂肪酸，促進心血管健康</div>
        </div>
      </div>

      <div class="food toast">
        <div class="food-img">
          <img src="./全麥吐司.png" alt="吐司">
          <div class="info">提供碳水化合物，維持能量</div>
        </div>
      </div>

      <div class="food orange">
        <div class="food-img">
          <img src="./柳橙.png" alt="橘子">
          <div class="info">富含維生素C，增強免疫力</div>
        </div>
      </div>

      <div class="food pumpkin">
        <div class="food-img">
          <img src="./南瓜.png" alt="南瓜">
          <div class="info">含有 β-胡蘿蔔素，有助視力與抗氧化</div>
        </div>
      </div>
    </div>



  </div>

</body>

</html>
