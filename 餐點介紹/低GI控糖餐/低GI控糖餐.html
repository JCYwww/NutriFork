<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <title>低GI控糖餐</title>
  <link rel="stylesheet" href="./低GI控糖餐.css">
  <script src="./低GI控糖餐.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Noto+Serif+JP:wght@200..900&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Rampart+One&family=Stick&display=swap"
    rel="stylesheet">
</head>

<body>

  <div class="logo">
    <a href="../../菜單/菜單.html">
      <img src="./logo3.png" alt="">
    </a>
  </div>

  <img src="./火箭.png" alt="火箭" class="rocket" />

  <div class="main-container">

    <div class="meal-info">
      <h2 class="name">低GI控糖餐</h2>
      <p>• 豐富蔬果與健康脂肪</p>
      <p>• 富含纖維與抗氧化物</p>
      <p>• 有助於血糖控制</p>
      <p class="price">$140</p>
    </div>

    <div class="plate-container">
      <img src="./盤子.png" alt="盤子背景" class="plate">

      <div class="food mackerel">
        <div class="food-img">
          <img src="./烤鯖魚.png" alt="鯖魚">
          <div class="info">富含Omega-3，有助控糖與護心</div>
        </div>
      </div>

      <div class="food sweetpotato">
        <div class="food-img">
          <img src="./地瓜.png" alt="地瓜">
          <div class="info">低GI碳水，提供飽足與能量</div>
        </div>
      </div>

      <div class="food greens">
        <div class="food-img">
          <img src="./空心菜.png" alt="燙青菜">
          <div class="info">高鉀葉菜，有助排水與穩壓</div>
        </div>
      </div>

      <div class="food kiwi">
        <div class="food-img">
          <img src="./奇異果.png" alt="奇異果">
          <div class="info">富含酵素與維C，幫助消化</div>
        </div>
      </div>
    </div>


  </div>

</body>

</html>
