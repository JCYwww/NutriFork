<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <title>地中海飲食餐</title>
  <link rel="stylesheet" href="./地中海健康餐.css">
  <script src="./地中海健康餐.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Noto+Serif+JP:wght@200..900&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Rampart+One&family=Stick&display=swap"
    rel="stylesheet">
</head>

<body>

  <div class="logo">
    <a href="../../菜單/菜單.html">
      <img src="./logo3.png" alt="">
    </a>
  </div>

  <img src="./火箭.png" alt="火箭" class="rocket" />


  <div class="main-container">
    <div class="meal-info">
      <h2 class="name">地中海健康餐</h2>
      <p>• 好油脂＋多蔬果</p>
      <p>• 抗老抗發炎</p>
      <p>• 強化心血管健康</p>
      <p class="price">$130</p>
    </div>

    <div class="plate-container">
      <img src="./盤子.png" alt="盤子背景" class="plate">

      <div class="food fish">
        <div class="food-img">
          <img src="./烤鯖魚.png" alt="鯖魚">
          <div class="info">好脂蛋白，保護心血管</div>
        </div>
      </div>

      <div class="food salad">
        <div class="food-img">
          <img src="./番茄橄欖沙拉.png" alt="沙拉">
          <div class="info">橄欖油＋番茄，抗氧化又養顏</div>
        </div>
      </div>

      <div class="food toast">
        <div class="food-img">
          <img src="./全麥吐司.png" alt="全麥吐司">
          <div class="info">高纖低升糖，有助代謝穩定</div>
        </div>
      </div>

      <div class="food apple">
        <div class="food-img">
          <img src="./蘋果.png" alt="蘋果">
          <div class="info">富含維C與纖維，促進代謝</div>
        </div>
      </div>
    </div>


  </div>

</body>

</html>
