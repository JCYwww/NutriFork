<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菜單</title>
  <link rel="shortcut icon" href="/logo_icon.png" type="image/x-icon">
  <link rel="stylesheet" href="./菜單.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Noto+Serif+JP:wght@200..900&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Rampart+One&family=Stick&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="logo">
      <a href="../首頁/首頁.html">
        <img src="../assets/logo.png" alt="">
      </a>
  </div>

  <nav class="img-navbar">
      <a href="../首頁/首頁.html"><img src="../assets/div_pic/首頁.png" alt="首頁"></a>
      <a href="../菜單/菜單.html"><img src="../assets/div_pic/菜單.png" alt="菜單"></a>
      <a href="../遊戲/遊戲.html"><img src="../assets/div_pic/表單.png" alt="表單"></a>
      <a href="../生產履歷/生產履歷.html"><img src="../assets/div_pic/生產履歷.png" alt="生產履歷"></a>
      <a href="../人員介紹/人員介紹.html"><img src="../assets/div_pic/人員介紹.png" alt="人員介紹"></a>
  </nav>

  <div class="floating-cart">
    <img src="./購物車.png" alt="購物車" class="cart-icon">
    <span class="cart-count">0</span>
    <div class="cart-panel">
      <div class="cart-header">
        <h3>購物車</h3>
        <button class="close-cart">&times;</button>
      </div>
      <div class="cart-items">
        <!-- 購物車項目在這裡動態添加 -->
      </div>
      <div class="cart-footer">
        <div class="cart-total">總計: $0</div>
        <button class="checkout-btn">結帳</button>
      </div>
    </div>
  </div>

  <!-- 結帳總結彈出視窗 -->
  <div class="checkout-modal" id="checkoutModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>訂單總結</h2>
        <button class="close-modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="order-items">
          <!-- 訂單項目在這裡動態添加 -->
        </div>
        <div class="order-summary">
          <div class="summary-row">
            <span>商品總數：</span>
            <span id="totalItems">0</span>
          </div>
          <div class="summary-row">
            <span>商品總額：</span>
            <span id="subtotal">$0</span>
          </div>
          <div class="summary-row">
            <span>運費：</span>
            <span id="shipping">$0</span>
          </div>
          <div class="summary-row total">
            <span>應付總額：</span>
            <span id="totalAmount">$0</span>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="confirm-order-btn">確認訂單</button>
      </div>
    </div>
  </div>

  <div class="meal-container">
    <a href="../餐點介紹/每日超值餐/每日超值餐.html" class="meal-link">
      <div class="meal-item">
        <div class="meal-title">每日超值餐</div>
        <div class="meal-img-container">
          <img src="每日超值.png" alt="餐點圖示" />
          <div class="meal-price">100元</div>
        </div>
      </div>
    </a>

    <a href="../餐點介紹/素食健康餐/素食健康餐.html" class="meal-link">
      <div class="meal-item">
        <div class="meal-title">素食健康餐</div>
        <div class="meal-img-container">
          <img src="./素食健康 (2).png" alt="餐點圖示" />
          <div class="meal-price">120元</div>
        </div>
      </div>
    </a>

    <a href="../餐點介紹/地中海健康餐/地中海健康餐.html" class="meal-link">
      <div class="meal-item">
        <div class="meal-title">地中海健康餐</div>
        <div class="meal-img-container">
          <img src="./地中海.png" alt="餐點圖示" />
          <div class="meal-price">130元</div>
        </div>
      </div>
    </a>

    <a href="../餐點介紹/低GI控糖餐/低GI控糖餐.html" class="meal-link">
      <div class="meal-item">
        <div class="meal-title">低GI控糖餐</div>
        <div class="meal-img-container">
          <img src="./低gi .png" alt="餐點圖示" />
          <div class="meal-price">140元</div>
        </div>
      </div>
    </a>

    <a href="../餐點介紹/低碳生酮餐/低碳生酮餐.html" class="meal-link">
      <div class="meal-item">
        <div class="meal-title">低碳生酮餐</div>
        <div class="meal-img-container">
          <img src="./低碳生酮.png" alt="餐點圖示" />
          <div class="meal-price">150元</div>
        </div>
      </div>
    </a>

    <a href="../餐點介紹/高蛋白健身餐/高蛋白健身餐.html" class="meal-link">
      <div class="meal-item">
        <div class="meal-title">高蛋白健身餐</div>
        <div class="meal-img-container">
          <img src="./7F1835D6-F202-4436-AAA9-A46A5C8F8FA7.png" alt="餐點圖示" />
          <div class="meal-price">150元</div>
        </div>
      </div>
    </a>
  </div>

  <div class="floating-fruits">
    <div class="fruit tomato" data-info="我有豐富的維生素C，養顏又美容!"></div>
    <div class="fruit corner" data-info="我不僅低熱量還高纖維，讓你減重順順利利!"></div>
    <div class="fruit correct" data-info="我富含了很多營養，讓你可以保護視力、養顏和處進消化等!"></div>
    <div class="tooltip" id="tooltip"></div>
  </div>

  <script src="./菜單.js"></script>
</body>

</html>
